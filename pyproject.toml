[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gadbad"
dynamic = ["version"]
description = "Kuch toh gadbad hai: static analysis for scam APKs spreading over WhatsApp in India (SMS/OTP theft, accessibility abuse, call forwarding, Telegram/C2 exfiltration)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kirtan Bhatt", email = "kirtan11bhatt@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["android", "apk", "malware-analysis", "fraud-detection", "india", "upi", "otp", "security", "static-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Natural Language :: Hindi",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/kirtanbhatt10/gadbad"
Issues = "https://github.com/kirtanbhatt10/gadbad/issues"
Changelog = "https://github.com/kirtanbhatt10/gadbad/blob/main/CHANGELOG.md"
Security = "https://github.com/kirtanbhatt10/gadbad/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "build>=1.2", "twine>=5"]

[project.scripts]
gadbad = "gadbad.cli:main"

[tool.setuptools.dynamic]
version = { attr = "gadbad.__version__" }

[tool.setuptools.packages.find]
include = ["gadbad*"]

[tool.setuptools.package-data]
gadbad = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["gadbad"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = [
    "RUF001",  # Hindi text and the ellipsis character are intentional
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S108"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["gadbad"]
